name: Android build and checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark_only:
        description: Run only the synthetic backup benchmark
        type: boolean
        default: false
      fixture_set:
        description: Benchmark fixture selection
        type: choice
        default: all
        options: [all, images-10, fragmented-10, small-retry]
permissions:
  contents: read
jobs:
  build:
    if: "inputs.benchmark_only != true && !contains(github.event.head_commit.message, '[performance-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Compile, test and lint
        run: ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: HuangNotify-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HuangNotify-unsigned-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
  device-tests:
    if: "inputs.benchmark_only != true && !contains(github.event.head_commit.message, '[performance-only]')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare self-update fixture APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :probe:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/next.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "$RUNNER_TEMP/upgrade-tests.apk"
          git fetch --depth=1 origin tag v1.4.3
          mkdir -p "$RUNNER_TEMP/huangnotify-previous"
          git archive v1.4.3 | tar -x -C "$RUNNER_TEMP/huangnotify-previous"
          "$RUNNER_TEMP/huangnotify-previous/gradlew" -p "$RUNNER_TEMP/huangnotify-previous" :app:assembleDebug
          cp "$RUNNER_TEMP/huangnotify-previous/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/previous.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install probe/build/outputs/apk/debug/probe-debug.apk
            ./gradlew :app:connectedDebugAndroidTest || { adb pull /data/local/tmp/huangnotify-ui-preview ui-preview || true; exit 1; }
            adb pull /data/local/tmp/huangnotify-ui-preview ui-preview || true
            adb install -r "$RUNNER_TEMP/next.apk"
            adb install -r "$RUNNER_TEMP/upgrade-tests.apk"
            adb shell am instrument -w -e phase interrupt-before dev.huang.notify.test/dev.huang.notify.UpgradeHarness > backup-interrupt-before.txt
            grep -q 'INSTRUMENTATION_CODE: -1' backup-interrupt-before.txt
            adb shell am force-stop dev.huang.notify
            adb shell am instrument -w -e phase interrupt-after dev.huang.notify.test/dev.huang.notify.UpgradeHarness > backup-interrupt-after.txt
            grep -q 'INSTRUMENTATION_CODE: -1' backup-interrupt-after.txt
            adb uninstall dev.huang.notify || true
            adb uninstall dev.huang.notify.test || true
            adb install "$RUNNER_TEMP/previous.apk"
            adb install "$RUNNER_TEMP/upgrade-tests.apk"
            adb push "$RUNNER_TEMP/next.apk" /data/local/tmp/huangnotify-next.apk
            adb shell appops set dev.huang.notify REQUEST_INSTALL_PACKAGES allow
            adb shell am instrument -w -e phase before dev.huang.notify.test/dev.huang.notify.UpgradeHarness > upgrade-before.txt || true
            adb shell screencap -p /data/local/tmp/upgrade-installer.png
            adb pull /data/local/tmp/upgrade-installer.png upgrade-installer.png
            adb shell uiautomator dump /data/local/tmp/upgrade-installer.xml || true
            adb pull /data/local/tmp/upgrade-installer.xml upgrade-installer.xml || true
            adb shell am instrument -w -e phase after dev.huang.notify.test/dev.huang.notify.UpgradeHarness > upgrade-after.txt
            grep -q 'INSTRUMENTATION_CODE: -1' upgrade-after.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-preview-api-${{ matrix.api }}
          path: ui-preview/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          path: app/build/reports/androidTests/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-update-cycle-api-${{ matrix.api }}
          path: |
            upgrade-*
            backup-interrupt-*

  backup-performance:
    name: backup-performance (${{ matrix.kind }}-${{ matrix.size }})
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(inputs.fixture_set == 'small-retry' && '{"include":[{"kind":"images","size":10},{"kind":"fragmented","size":10}]}' || inputs.fixture_set == 'images-10' && '{"include":[{"kind":"images","size":10}]}' || inputs.fixture_set == 'fragmented-10' && '{"include":[{"kind":"fragmented","size":10}]}' || '{"include":[{"kind":"text","size":10},{"kind":"text","size":50},{"kind":"text","size":99},{"kind":"images","size":10},{"kind":"images","size":50},{"kind":"images","size":99},{"kind":"many-short","size":10},{"kind":"fragmented","size":10}]}') }}
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[benchmark]')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare benchmark APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 45m adb shell am instrument -w -e phase benchmark -e benchmark_kind ${{ matrix.kind }} -e benchmark_size ${{ matrix.size }} dev.huang.notify.test/dev.huang.notify.UpgradeHarness | tee backup-performance.txt
            adb exec-out run-as dev.huang.notify cat files/backup-performance.json > backup-performance.json
            grep -q 'INSTRUMENTATION_CODE: -1' backup-performance.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-performance-${{ matrix.kind }}-${{ matrix.size }}-api-35
          path: backup-performance.*
