name: Publish HuangNotify 1.3.0
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-1.3.0.yml, .github/scripts/publish-release-1.3.0.py]
  workflow_dispatch:
permissions:
  actions: read
  contents: write
concurrency:
  group: huangnotify-release-1.3.0
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified signed APK and verify public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish-release-1.3.0.py
