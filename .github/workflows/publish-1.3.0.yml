name: Attach and verify HuangNotify 1.9.0
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: huangnotify-release-1.9.0
  cancel-in-progress: false
jobs:
  attach:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Upload and verify the signed release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/attach-1.9.0.py
