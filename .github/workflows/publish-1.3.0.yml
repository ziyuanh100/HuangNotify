name: Publish HuangNotify 1.10.0
run-name: Publish the verified HuangNotify 1.10.0 APK
on:
  push:
    branches: [codex/publish-1.10.0]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: huangnotify-release-1.10.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == 'codex/publish-1.10.0'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Publish and verify release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/publish-release-1.10.0.py
